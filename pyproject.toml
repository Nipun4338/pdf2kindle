[project]
name = "pdf2kindle"
version = "0.1.0"
description = "Turn Bengali/English PDFs into Kindle-friendly reflowable EPUBs, fully offline."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pdfminer.six>=20240706",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "pytesseract>=0.3.13",
]

[project.scripts]
pdf2kindle = "pdf2kindle.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "playwright>=1.47",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2kindle"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Bengali glyph tables and test strings legitimately contain look-alike characters.
ignore = ["RUF001", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ocr: needs Tesseract with ben+eng data",
    "e2e: drives the web UI in a real browser",
    "kindle: runs Amazon's Kindle Previewer converter",
]
